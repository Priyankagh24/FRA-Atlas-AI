services:
  - type: web
    name: fra-backend
    env: python
    buildCommand: apt-get install -y tesseract-ocr && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HF_SPACE_URL
        sync: false
    runtime: python
    pythonVersion: 3.11.9